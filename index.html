<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>¿Qué tocás?</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #05050f;
    height: 100%;
    width: 100%;
    cursor: pointer;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  .cartel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 3rem;
    color: #fff;
    text-shadow: 0 0 10px #ff0, 0 0 20px #f0f, 0 0 30px #0ff;
    pointer-events: none;
    opacity: 0;
    animation: popcartel 1.1s ease-out forwards;
    white-space: nowrap;
    z-index: 10;
  }
  @keyframes popcartel {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-5deg); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4) rotate(0deg); }
  }
  .hint {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #888;
    font-family: sans-serif;
    font-size: 0.9rem;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Tocá o hacé clic en cualquier lado de la pantalla ✨</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const DURATION = 5000; // duración de cada fuego artificial en ms
let particles = [];

// --- SONIDO ---
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// silbido ascendente/descendente al lanzarse el fuego artificial
function sonidoSilbido(delay = 0) {
  const ctxA = getAudioCtx();
  const t0 = ctxA.currentTime + delay;
  const osc = ctxA.createOscillator();
  const gain = ctxA.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(rand(500, 700), t0);
  osc.frequency.exponentialRampToValueAtTime(rand(1400, 1800), t0 + 0.3);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.15, t0 + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
  osc.connect(gain).connect(ctxA.destination);
  osc.start(t0);
  osc.stop(t0 + 0.4);
}

// explosión tipo "ruido blanco" con caída rápida
function sonidoExplosion(delay = 0) {
  const ctxA = getAudioCtx();
  const t0 = ctxA.currentTime + delay;
  const bufferSize = ctxA.sampleRate * 0.6;
  const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
  }
  const noise = ctxA.createBufferSource();
  noise.buffer = buffer;

  const filter = ctxA.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = rand(700, 1600);
  filter.Q.value = 0.7;

  const gain = ctxA.createGain();
  gain.gain.setValueAtTime(0.35, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);

  noise.connect(filter).connect(gain).connect(ctxA.destination);
  noise.start(t0);
  noise.stop(t0 + 0.6);
}

function rand(min, max) {
  return Math.random() * (max - min) + min;
}

function colorPalette() {
  const colors = ['#ff004d','#ffec27','#00e5ff','#7fff00','#ff6ec7','#ffa500','#c400ff','#39ff14'];
  return colors[Math.floor(Math.random() * colors.length)];
}

// crea una explosión de fuegos artificiales en una posición dada
function crearExplosion(x, y, conSilbido = false) {
  if (conSilbido) sonidoSilbido(0);
  sonidoExplosion(conSilbido ? 0.28 : 0);
  const color = colorPalette();
  const cantidad = Math.floor(rand(40, 70));
  const now = performance.now();
  for (let i = 0; i < cantidad; i++) {
    const angle = (Math.PI * 2 * i) / cantidad + rand(-0.15, 0.15);
    const speed = rand(1.5, 6);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      born: now,
      life: DURATION,
      size: rand(1.5, 3.5),
      gravity: 0.02
    });
  }
}

// al tocar/clickear: cartel + varias explosiones repartidas por la pantalla
function onToque(x, y) {
  // cartel de texto
  const cartel = document.createElement('div');
  cartel.className = 'cartel';
  cartel.textContent = '¿QUÉ TOCÁS, GIL?';
  cartel.style.left = x + 'px';
  cartel.style.top = y + 'px';
  document.body.appendChild(cartel);
  setTimeout(() => cartel.remove(), 1200);

  // explosión justo donde tocaste
  crearExplosion(x, y, true);

  // más explosiones repartidas "para todos lados"
  const extras = Math.floor(rand(5, 9));
  for (let i = 0; i < extras; i++) {
    const t = rand(0, 700);
    setTimeout(() => {
      crearExplosion(rand(0, canvas.width), rand(0, canvas.height * 0.8), true);
    }, t);
  }
}

function loop(now) {
  ctx.fillStyle = 'rgba(5, 5, 15, 0.25)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles = particles.filter(p => now - p.born < p.life);

  for (const p of particles) {
    const t = (now - p.born) / p.life;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.985;
    p.vy *= 0.985;

    const alpha = 1 - t;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 - t * 0.4), 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(alpha, 0);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('pointerdown', (e) => {
  onToque(e.clientX, e.clientY);
});
</script>
</body>
</html>
